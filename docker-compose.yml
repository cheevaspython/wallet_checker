version: "3.9"

services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: docker/Dockerfile.back
    volumes:
      - .:/example
    env_file: .env
    command: >
      sh -c "uvicorn source.main:app --host 0.0.0.0 --port 8088 --reload"
    depends_on:
      db_postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: always

  db_postgres:
    container_name: db_postgres
    image: postgres:16.2-alpine
    restart: unless-stopped
    env_file: .env
    networks:
      - app_network
    volumes:
      - application_db:/var/lib/postgresql/data/
      - ./init-scripts:/docker-entrypoint-initdb.d/
    healthcheck:
      test: "bash -c 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB'"
      interval: 5s
      retries: 3
      start_period: 30s

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    env_file: .env
    ports:
      - "80:8080"
    volumes_from:
      - backend
    volumes:
      - static:/static/
    restart: always
    networks:
      - app_network
    links:
      - backend
    depends_on:
      - backend
      - db_postgres

volumes:
  application_db:
  static:
  media:

networks:
  app_network:
